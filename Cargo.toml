[workspace]
resolver = "2"
members = [
    "core/common",
    "core/security-engine",
    "core/threat-analysis",
    "apps/windows/sentinel-agent",
]
default-members = [
    "core/common",
    "core/security-engine",
    "core/threat-analysis",
    "apps/windows/sentinel-agent",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["DjSergio88"]
license = "UNLICENSED"
repository = "https://github.com/DjSergio88/Sentinel-AI-Security"
rust-version = "1.75"

[workspace.dependencies]
sentinel-common = { path = "core/common" }
sentinel-security-engine = { path = "core/security-engine" }
sentinel-threat-analysis = { path = "core/threat-analysis" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
sysinfo = "0.33"
winreg = "0.55"
walkdir = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
